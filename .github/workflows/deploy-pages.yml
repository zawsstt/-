name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        # esbuild in package.json conflicts with Vite 8 peer range,
        # plain `npm install` fails with eresolve, so legacy peer deps are required.
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        # Project Pages lives at https://zawsstt.github.io/-/ , not the domain root,
        # so the build base must be /-/ or JS/CSS assets will 404.
        run: npm run build -- --base=/-/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
